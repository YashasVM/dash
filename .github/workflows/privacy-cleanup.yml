name: One-time privacy cleanup

on:
  push:
    paths:
      - '.github/workflows/privacy-cleanup.yml'

permissions:
  contents: write

jobs:
  scrub-commit-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch every branch and tag
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force

      - name: Rewrite private author metadata
        env:
          NEW_EMAIL: 95484845+YashasVM@users.noreply.github.com
        run: |
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            if [ "$GIT_AUTHOR_NAME" = "YashasVM" ]; then
              case "$GIT_AUTHOR_EMAIL" in
                *@gmail.com) GIT_AUTHOR_EMAIL="$NEW_EMAIL"; export GIT_AUTHOR_EMAIL ;;
              esac
            fi
            if [ "$GIT_COMMITTER_NAME" = "YashasVM" ]; then
              case "$GIT_COMMITTER_EMAIL" in
                *@gmail.com) GIT_COMMITTER_EMAIL="$NEW_EMAIL"; export GIT_COMMITTER_EMAIL ;;
              esac
            fi
          ' --tag-name-filter cat -- --all

      - name: Remove this one-time workflow and force-push cleaned refs
        env:
          NEW_EMAIL: 95484845+YashasVM@users.noreply.github.com
        run: |
          git config user.name "YashasVM"
          git config user.email "$NEW_EMAIL"

          rm .github/workflows/privacy-cleanup.yml
          git add -u .github/workflows/privacy-cleanup.yml
          git commit -m "Remove one-time privacy cleanup workflow"

          git push origin HEAD:refs/heads/main --force

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "main" ] && continue
            sha="$(git rev-parse "$ref")"
            git push origin "$sha:refs/heads/$branch" --force
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          git push origin --force --tags
